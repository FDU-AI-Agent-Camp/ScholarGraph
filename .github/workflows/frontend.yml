# 前端门禁：与 frontend/README.md、docs/v1/pr-checklist.md 一致
name: Frontend

on:
  push:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - 'docs/api/openapi.yaml'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - 'docs/api/openapi.yaml'
      - '.github/workflows/frontend.yml'

defaults:
  run:
    working-directory: frontend

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Static checks
        run: npm run check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
