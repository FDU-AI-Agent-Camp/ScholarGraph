# 后端门禁：Makefile 一键 CI（ruff + pyright + pytest + 安全扫描 + 覆盖率）
# 与 docs/v1/pr-checklist.md、scripts/check_backend.py、AGENTS.md 保持一致
name: Backend

on:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/api/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/backend.yml'
      - 'pyrightconfig.json'
      - 'Makefile'
      - 'data/patrol_method_overlap_golden.json'
      - 'data/patrol_golden_set.json'
      - '.github/workflows/patrol-release-gate.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/api/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/backend.yml'
      - 'pyrightconfig.json'
      - 'Makefile'
      - 'data/patrol_method_overlap_golden.json'
      - 'data/patrol_golden_set.json'
      - '.github/workflows/patrol-release-gate.yml'

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      # Makefile 用于线上 Ubuntu CI 一键执行完整门禁。
      # Windows 本地开发请直接使用：uv run python scripts/check_backend.py
      - name: Backend CI gate
        run: make ci

      # 以下独立步骤用于满足 V1 DoD D-01/D-02 acceptance test 对工作流命令的显式断言。
      - name: Ruff check
        run: uv run ruff check backend tests scripts

      - name: Ruff format check
        run: uv run ruff format --check backend tests scripts

      - name: Pytest PR gate (stub only, no live_patrol)
        run: uv run pytest -q -m "not red and not live and not live_patrol and not live_mineru and not live_grobid and not live_benchmark and not live_e10 and not live_judge and not live_head_merge"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
