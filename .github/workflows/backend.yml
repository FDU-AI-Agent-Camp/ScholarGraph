# 后端门禁：ruff + pytest + 安全扫描 + 覆盖率（与 docs/v1/pr-checklist.md、scripts/check_backend.py 一致）
name: Backend

on:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/api/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/api/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/backend.yml'

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Ruff lint
        run: uv run ruff check backend tests scripts

      - name: Ruff format check
        run: uv run ruff format --check backend tests scripts

      - name: Dependency security audit
        run: uv run pip-audit --desc --format=json --local --path=.venv > pip-audit-report.json || true

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json

      - name: Pytest with coverage
        run: uv run python -m pytest -q --tb=short --cov=backend --cov-report=xml --cov-report=term-missing --cov-fail-under=30 -m "not red and not live_mineru and not live_grobid"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
