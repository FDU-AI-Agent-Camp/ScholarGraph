# 后端门禁：Makefile 一键 CI（ruff + pyright + pytest + 安全扫描 + 覆盖率）
# 与 docs/v1/pr-checklist.md、scripts/check_backend.py、AGENTS.md 保持一致
name: Backend

on:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/api/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/backend.yml'
      - 'pyrightconfig.json'
      - 'Makefile'
  pull_request:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/api/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/backend.yml'
      - 'pyrightconfig.json'
      - 'Makefile'

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      # Makefile 用于线上 Ubuntu CI 一键执行完整门禁。
      # Windows 本地开发请直接使用：uv run python scripts/check_backend.py
      - name: Backend CI gate
        run: make ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
