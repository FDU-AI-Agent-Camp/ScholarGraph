openapi: 3.1.0
info:
  title: ScholarGraph API
  version: 1.0.0
  description: |
    V1 冻结契约。人文档见 docs/v1/api-contract.md。
    SSE 仅 POST /papers/{paper_id}/qa/stream；V2 多类型 citation 见 docs/api/sse-qa.md。

servers:
  - url: http://localhost:8000/api/v1

tags:
  - name: health
  - name: papers
  - name: patrol

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /papers:
    get:
      tags: [papers]
      operationId: listPapers
      parameters:
        - name: paradigm
          in: query
          schema:
            $ref: "#/components/schemas/Paradigm"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PaperStatus"
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperListResponse"
    post:
      tags: [papers]
      operationId: createPaper
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF, application/pdf, max 32MB suggested
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperCreateResponse"
        "400":
          description: INGEST_FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /papers/{paper_id}:
    get:
      tags: [papers]
      operationId: getPaper
      parameters:
        - $ref: "#/components/parameters/PaperId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /papers/{paper_id}/status:
    get:
      tags: [papers]
      operationId: getPaperStatus
      parameters:
        - $ref: "#/components/parameters/PaperId"
      responses:
        "200":
          description: Pipeline status for polling
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperStatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /papers/{paper_id}/graph:
    get:
      tags: [papers]
      operationId: getPaperGraph
      parameters:
        - $ref: "#/components/parameters/PaperId"
      responses:
        "200":
          description: UnifiedPaperGraph (not G6-nested; FE converts via toG6GraphPayload)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: GRAPH_NOT_READY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /papers/{paper_id}/reextract:
    post:
      tags: [papers]
      operationId: forceReextractPaper
      summary: 强制重新抽取图谱（逃生舱）
      description: |
        当上一轮回抽取因 LLM 超时/限流等原因降级为启发式 fallback 时，
        调用此接口清空已有图谱、预览和 warnings，重置状态为 pending 并重新入队流水线。
      parameters:
        - $ref: "#/components/parameters/PaperId"
      responses:
        "200":
          description: 已重新入队，返回当前 pending 状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperStatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: PAPER_ALREADY_PROCESSING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: PDF_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /papers/{paper_id}/qa/stream:
    post:
      tags: [papers]
      operationId: streamPaperQa
      parameters:
        - $ref: "#/components/parameters/PaperId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QaStreamRequest"
      responses:
        "200":
          description: |
            `text/event-stream; charset=utf-8`。帧格式见 docs/api/sse-qa.md。
            Wire 为 SSE 文本；`components/schemas/QaStream*` 描述各 `event:` 的 JSON data 载荷。
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE 帧序列。每帧 `event:` + `data:`（单行 JSON）。
                  citation 载荷 schema 见 `#/components/schemas/QaStreamCitation`。
              examples:
                v2MultiTypeCitation:
                  summary: V2 多类型 citation 示例
                  value: |
                    event: message
                    data: {"delta":"根据检索上下文，"}

                    event: citation
                    data: {"type":"node","paper_id":"hss-001","node_id":"n1","label":"核心论点"}

                    event: citation
                    data: {"type":"edge","paper_id":"hss-001","edge_id":"e1","label":"分论点 → 核心论点"}

                    event: citation
                    data: {"type":"chunk","paper_id":"hss-001","chunk_id":"hss-001-00001","label":"片段 hss-001-00001","text_preview":"制度一旦形成便会产生路径依赖。"}

                    event: citation
                    data: {"type":"page","paper_id":"hss-001","page":12,"label":"第12页"}

                    event: done
                    data: {"answer_id":"ans-550e8400"}
        "400":
          description: CROSS_PAPER — 跨论文问题，引导使用 Patrol
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: GRAPH_NOT_READY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /patrol:
    post:
      tags: [patrol]
      operationId: runPatrol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatrolRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatrolResponse"

components:
  parameters:
    PaperId:
      name: paper_id
      in: path
      required: true
      schema:
        type: string
        example: hss-001

  responses:
    NotFound:
      description: PAPER_NOT_FOUND
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Paradigm:
      type: string
      enum: [STEM, HSS]

    PaperStatus:
      type: string
      enum: [pending, processing, ready, ready_with_warnings, failed]
      description: |
        `ready_with_warnings` means the graph is available but failed the
        confidence gate (e.g. low SUPPORTS rationale coverage, too many
        isolated nodes, or a high ratio of generic fallback edges such as
        RELATES_TO). The client should render a yellow warning border.

    PipelineStage:
      type: string
      enum: [ingesting, head_refining, classifying, extracting, storing, ready, failed]

    FailedDuringStage:
      type: string
      description: Pipeline step active when status=failed (excludes terminal stage values).
      enum: [ingesting, head_refining, classifying, extracting, storing]

    IngestHead:
      type: object
      properties:
        title:
          type: string
        abstract:
          type: string
        keywords:
          type: string
        intro:
          type: string
        sources:
          type: object
          additionalProperties:
            type: string
          description: Per-field provenance tag (pymupdf, mineru, grobid, llm, empty).

    ParadigmClassification:
      type: object
      required: [paradigm, confidence, reason]
      properties:
        paradigm:
          $ref: "#/components/schemas/Paradigm"
        confidence:
          type: number
          minimum: 0
          maximum: 1
        reason:
          type: string
      example:
        paradigm: HSS
        confidence: 0.95
        reason: 本文使用了历史制度主义视角，无显式数据集与量化指标，属于典型的人文社科规范。

    Meta:
      type: object
      properties:
        request_id:
          type: string
          format: uuid

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"

    HealthResponse:
      type: object
      properties:
        data:
          type: object
          required: [status, version, llm_mode, llm_connected, llm_note, components]
          properties:
            status:
              type: string
              enum: [healthy, degraded]
              description: Aggregate health — degraded when Patrol claim_evolution funnel is incomplete in live mode.
              example: healthy
            version:
              type: string
              example: 1.0.0
            app_profile:
              type: string
              nullable: true
              enum: [ci, demo, prod]
            components:
              type: object
              required: [patrol_service]
              properties:
                patrol_service:
                  $ref: "#/components/schemas/PatrolServiceHealth"
            llm_mode:
              type: string
              enum: [mock, live]
              example: mock
            llm_connected:
              type: boolean
              example: false
            llm_note:
              type: string
              example: Mock 模式：LLM 云服务尚未接入，问答/巡检返回本地模板。
            grobid_url:
              type: string
            grobid_connected:
              type: boolean
            grobid_note:
              type: string
            patrol_claim_rq_funnel_enabled:
              type: boolean
            patrol_config_warnings:
              type: array
              items:
                type: string
            patrol_note:
              type: string
        meta:
          $ref: "#/components/schemas/Meta"

    PatrolServiceHealth:
      type: object
      required: [status, claim_rq_funnel_enabled, reranker_status, active_profile]
      properties:
        status:
          type: string
          enum: [fully_functional, degraded]
        claim_rq_funnel_enabled:
          type: boolean
        reranker_status:
          type: string
          enum: [READY, DISABLED_FALLBACK_ACTIVE, MISCONFIGURED, MOCK_LOCAL]
        active_profile:
          type: string
          nullable: true
          enum: [ci, demo, prod]
        warnings:
          type: array
          items:
            type: string

    PaperSummary:
      type: object
      required: [paper_id, status, created_at]
      properties:
        paper_id:
          type: string
        title:
          type: string
          nullable: true
        paradigm:
          $ref: "#/components/schemas/Paradigm"
          nullable: true
        status:
          $ref: "#/components/schemas/PaperStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true

    PaperListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/PaperSummary"
            total:
              type: integer
            offset:
              type: integer
            limit:
              type: integer
        meta:
          $ref: "#/components/schemas/Meta"

    PaperCreateResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            paper_id:
              type: string
            status:
              $ref: "#/components/schemas/PaperStatus"
            message:
              type: string
        meta:
          $ref: "#/components/schemas/Meta"

    PaperDetail:
      allOf:
        - $ref: "#/components/schemas/PaperSummary"
        - type: object
          properties:
            classification:
              $ref: "#/components/schemas/ParadigmClassification"
              nullable: true
            ingest_head:
              allOf:
                - $ref: "#/components/schemas/IngestHead"
              nullable: true
              description: Async dual(rules) merged document head with per-field sources.
            preview_available:
              type: boolean
              default: false
              description: True when an MVP skeleton graph is available for preview QA/graph.
            extract_warnings:
              type: array
              items:
                type: string
              description: |
                Machine-readable graph-extract degrade codes. Always includes the coarse
                `extract_heuristic_fallback` when heuristic fallback is triggered. Fine-grained
                root-cause codes may precede it: `extract_llm_timeout`,
                `extract_llm_rate_limited`, `extract_llm_json_invalid`,
                `extract_schema_validation_failed`, `extract_context_window_exceeded`.
              example: [extract_llm_timeout, extract_heuristic_fallback]
            classify_warnings:
              type: array
              items:
                type: string
              description: Machine-readable paradigm-classifier degrade codes (e.g. classifier_heuristic_fallback).
              example: []

    PaperDetailResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/PaperDetail"
        meta:
          $ref: "#/components/schemas/Meta"

    PaperStatusData:
      type: object
      required: [paper_id, status, percent, message, updated_at]
      properties:
        paper_id:
          type: string
        status:
          $ref: "#/components/schemas/PaperStatus"
        percent:
          type: integer
          minimum: 0
          maximum: 100
        stage:
          allOf:
            - $ref: "#/components/schemas/PipelineStage"
          nullable: true
        message:
          type: string
        updated_at:
          type: string
          format: date-time
        preview_available:
          type: boolean
          default: false
          description: True when an MVP skeleton graph can be queried for preview QA/graph.
        error_code:
          type: string
          nullable: true
          description: Machine-readable code when status=failed.
          example: LLM_JSON_INVALID
        failed_during:
          allOf:
            - $ref: "#/components/schemas/FailedDuringStage"
          nullable: true
          description: Pipeline step that was running when failure occurred (ingesting–storing only).
        head_refine_warnings:
          type: array
          items:
            type: string
          description: Machine-readable async head-refine degrade codes (e.g. mineru_unavailable, head_refine_timeout).
          example: []
        extract_warnings:
          type: array
          items:
            type: string
          description: |
            Machine-readable graph-extract degrade codes. Always includes the coarse
            `extract_heuristic_fallback` when heuristic fallback is triggered. Fine-grained
            root-cause codes may precede it: `extract_llm_timeout`,
            `extract_llm_rate_limited`, `extract_llm_json_invalid`,
            `extract_schema_validation_failed`, `extract_context_window_exceeded`.
          example: [extract_llm_timeout, extract_heuristic_fallback]
        classify_warnings:
          type: array
          items:
            type: string
          description: Machine-readable paradigm-classifier degrade codes (e.g. classifier_heuristic_fallback).
          example: []

    PaperStatusResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/PaperStatusData"
        meta:
          $ref: "#/components/schemas/Meta"

    GraphNode:
      type: object
      required: [id, label, type]
      properties:
        id:
          type: string
        label:
          type: string
        type:
          type: string
        data:
          type: object
          additionalProperties: true

    GraphEdge:
      type: object
      required: [id, source, target, label, type]
      properties:
        id:
          type: string
        source:
          type: string
        target:
          type: string
        label:
          type: string
        type:
          type: string
        rationale:
          type: string
          nullable: true
          description: Logical justification for the relationship.
        source_span:
          type: string
          nullable: true
          description: Verbatim textual evidence from the paper.
        confidence:
          type: string
          nullable: true
          enum: [HIGH, MEDIUM, LOW]
          description: Confidence tier for the relation.

    GraphResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            paper_id:
              type: string
            paradigm:
              $ref: "#/components/schemas/Paradigm"
            nodes:
              type: array
              items:
                $ref: "#/components/schemas/GraphNode"
            edges:
              type: array
              items:
                $ref: "#/components/schemas/GraphEdge"
        meta:
          $ref: "#/components/schemas/Meta"

    QaStreamRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 1

    QaStreamMessageData:
      type: object
      required: [delta]
      properties:
        delta:
          type: string
          description: LLM 增量文本片段

    QaStreamCitationType:
      type: string
      enum: [node, edge, chunk, page]
      description: |
        V2 citation 判别字段，与 backend.graph.qa_v2.dispatch_citation 一致。
        缺省 `type` 时 FE 应视为 `node`（V1 兼容）。

    QaStreamCitationNode:
      type: object
      required: [type, paper_id, node_id, label]
      properties:
        type:
          type: string
          enum: [node]
        paper_id:
          type: string
        node_id:
          type: string
        label:
          type: string
          description: 图谱节点展示名

    QaStreamCitationEdge:
      type: object
      required: [type, paper_id, edge_id, label]
      properties:
        type:
          type: string
          enum: [edge]
        paper_id:
          type: string
        edge_id:
          type: string
        label:
          type: string
          description: 通常为 `"{source_label} → {target_label}"`

    QaStreamCitationChunk:
      type: object
      required: [type, paper_id, chunk_id, label, text_preview, preview_state]
      properties:
        type:
          type: string
          enum: [chunk]
        paper_id:
          type: string
        chunk_id:
          type: string
        label:
          type: string
          description: 通常为 `"片段 {chunk_id}"`
        text_preview:
          type: string
          maxLength: 120
          description: 原文片段预览（最多 120 字符）；降级时为 canonical 占位文案
        preview_state:
          $ref: "#/components/schemas/ChunkPreviewState"

    ChunkPreviewState:
      type: string
      enum: [ready, indexing, retrieval_timeout, l2_timeout, hallucinated_id]
      description: |
        Chunk 引用预览解析状态（B10）。
        - `ready` — 正常原文预览
        - `indexing` — 向量索引尚未就绪
        - `retrieval_timeout` — 混合检索阶段超时降级
        - `l2_timeout` — 引用点 L2 惰性追溯超时（200ms）
        - `hallucinated_id` — 无法验证的 chunk_id

    QaStreamCitationPage:
      type: object
      required: [type, paper_id, page, label]
      properties:
        type:
          type: string
          enum: [page]
        paper_id:
          type: string
        page:
          oneOf:
            - type: integer
            - type: string
          description: 页码；非整数引用（如 appendix）时为 string
        label:
          type: string
          description: 通常为 `"第{page}页"`

    QaStreamCitation:
      description: |
        SSE `event: citation` 的 JSON data。由 LLM 输出 `[CITE:...]` 经 dispatch_citation 解析。
      oneOf:
        - $ref: "#/components/schemas/QaStreamCitationNode"
        - $ref: "#/components/schemas/QaStreamCitationEdge"
        - $ref: "#/components/schemas/QaStreamCitationChunk"
        - $ref: "#/components/schemas/QaStreamCitationPage"
      discriminator:
        propertyName: type
        mapping:
          node: "#/components/schemas/QaStreamCitationNode"
          edge: "#/components/schemas/QaStreamCitationEdge"
          chunk: "#/components/schemas/QaStreamCitationChunk"
          page: "#/components/schemas/QaStreamCitationPage"

    QaStreamDoneData:
      type: object
      required: [answer_id]
      properties:
        answer_id:
          type: string
        answer:
          type: string
          description: 可选；完整答案快照

    QaStreamErrorData:
      type: object
      required: [message]
      properties:
        code:
          type: string
          description: 流内异常常见 `QA_STREAM_ERROR`
        message:
          type: string

    PatrolMode:
      type: string
      enum: [lens_clash, contradiction, method_overlap, claim_evolution]

    PatrolPoint:
      type: object
      required: [mode]
      discriminator:
        propertyName: mode
      oneOf:
        - $ref: "#/components/schemas/ContradictionPoint"
        - $ref: "#/components/schemas/LensClashPoint"
        - $ref: "#/components/schemas/MethodOverlapPoint"
        - $ref: "#/components/schemas/ClaimEvolutionPoint"

    ContradictionPoint:
      type: object
      required: [mode, point_a, point_b, conflict_type]
      properties:
        mode:
          type: string
          enum: [contradiction]
        point_a:
          type: string
        point_b:
          type: string
        conflict_type:
          type: string

    LensClashPoint:
      type: object
      required: [mode, lens_a, lens_b, clash_aspect]
      properties:
        mode:
          type: string
          enum: [lens_clash]
        lens_a:
          type: string
        lens_b:
          type: string
        clash_aspect:
          type: string

    MethodOverlapPoint:
      type: object
      required: [mode, overlap_type, overlap_label, paper_a_usage, paper_b_usage]
      properties:
        mode:
          type: string
          enum: [method_overlap]
        overlap_type:
          type: string
          enum: [method, dataset, mixed]
          description: Whether the point compares methods or datasets. Dual overlap emits two points (method + dataset); mixed is deprecated.
        overlap_label:
          type: string
          description: The representative label of the overlapping item (method or dataset name).
        overlap_score:
          type: number
          nullable: true
          minimum: 0.0
          maximum: 1.0
          description: Significance score of the overlap. 1.0 for literal label match; 0.0-1.0 for semantic soft match.
        match_type:
          type: string
          nullable: true
          enum: [literal, semantic]
          description: How the overlap was determined.
        node_refs:
          type: array
          items:
            $ref: "#/components/schemas/NodeRef"
          description: Graph nodes anchored by this point; supports many-to-many literal overlaps.
        method:
          type: string
          description: Backwards-compatible alias for overlap_label.
        paper_a_usage:
          type: string
          description: How paper A uses the overlapping item.
        paper_b_usage:
          type: string
          description: How paper B uses the overlapping item.
        dataset_a:
          type: string
          nullable: true
        dataset_b:
          type: string
          nullable: true
        evidence_summary:
          type: string
          nullable: true
          description: Evidence-chain summary; may be null when the LLM does not produce one.

    ClaimEvolutionPoint:
      type: object
      required: [mode, research_question]
      properties:
        mode:
          type: string
          enum: [claim_evolution]
        research_question:
          type: string
        paper_a_claim:
          type: string
          nullable: true
          description: Paper A's core claim; may be backfilled from VectorStore chunks when no Claim node exists.
        paper_b_claim:
          type: string
          nullable: true
          description: Paper B's core claim; may be backfilled from VectorStore chunks when no Claim node exists.
        evolution_type:
          type: string
          nullable: true
          enum: [inherit, contradict, refined]
          description: Relationship between the two claims.
        problem_fit_score:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: Research-question fit score; higher means the two papers address more similar problems.
        evidence_summary:
          type: string
          nullable: true
          description: Evidence-chain summary; may be null when the LLM does not produce one.

    PatrolRequest:
      type: object
      required: [paper_ids, mode]
      properties:
        paper_ids:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: string
        mode:
          $ref: "#/components/schemas/PatrolMode"

    NodeRef:
      type: object
      required: [paper_id, node_id]
      properties:
        paper_id:
          type: string
        node_id:
          type: string
        label:
          type: string

    PatrolInsightStatus:
      type: string
      enum: [ready, insufficient_data]
      description: |
        Insight readiness status.
        `ready` means the insight was produced from a full LLM analysis.
        `insufficient_data` means the graphs lacked required node types or did not meet
        the mode-specific comparison criteria. Examples:
        - lens_clash: missing AnalyticalLens nodes.
        - contradiction: missing Thesis or SubArgument nodes.
        - method_overlap: no overlapping Method or Dataset labels.
        - claim_evolution: ResearchQuestion/Thesis too dissimilar, or claims are identical.

    PatrolInsight:
      type: object
      required: [insight_id, title, summary, status, paper_ids, node_refs]
      properties:
        insight_id:
          type: string
        title:
          type: string
        summary:
          type: string
        status:
          $ref: "#/components/schemas/PatrolInsightStatus"
        has_contradiction:
          type: boolean
          nullable: true
          description: Whether a contradiction was detected. Only meaningful when status='ready'.
        paper_ids:
          type: array
          items:
            type: string
        node_refs:
          type: array
          items:
            $ref: "#/components/schemas/NodeRef"
        structured_points:
          type: array
          items:
            $ref: "#/components/schemas/PatrolPoint"
        meta:
          type: object
          additionalProperties: true
          description: Machine-readable metadata about insight generation (e.g. RAG degradation flags).

    PatrolResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            mode:
              $ref: "#/components/schemas/PatrolMode"
            paper_ids:
              type: array
              items:
                type: string
            insights:
              type: array
              items:
                $ref: "#/components/schemas/PatrolInsight"
            generated_at:
              type: string
              format: date-time
        meta:
          $ref: "#/components/schemas/Meta"
