openapi: 3.1.0
info:
  title: ScholarGraph API
  version: 1.0.0
  description: |
    V1 冻结契约。人文档见 docs/v1/api-contract.md。
    SSE 仅 POST /papers/{paper_id}/qa/stream。

servers:
  - url: http://localhost:8000/api/v1

tags:
  - name: health
  - name: papers
  - name: patrol

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /papers:
    get:
      tags: [papers]
      operationId: listPapers
      parameters:
        - name: paradigm
          in: query
          schema:
            $ref: "#/components/schemas/Paradigm"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PaperStatus"
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperListResponse"
    post:
      tags: [papers]
      operationId: createPaper
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF, application/pdf, max 32MB suggested
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperCreateResponse"
        "400":
          description: INGEST_FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /papers/{paper_id}:
    get:
      tags: [papers]
      operationId: getPaper
      parameters:
        - $ref: "#/components/parameters/PaperId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /papers/{paper_id}/status:
    get:
      tags: [papers]
      operationId: getPaperStatus
      parameters:
        - $ref: "#/components/parameters/PaperId"
      responses:
        "200":
          description: Pipeline status for polling
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperStatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /papers/{paper_id}/graph:
    get:
      tags: [papers]
      operationId: getPaperGraph
      parameters:
        - $ref: "#/components/parameters/PaperId"
      responses:
        "200":
          description: UnifiedPaperGraph (not G6-nested; FE converts via toG6GraphPayload)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: GRAPH_NOT_READY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /papers/{paper_id}/reextract:
    post:
      tags: [papers]
      operationId: forceReextractPaper
      summary: 强制重新抽取图谱（逃生舱）
      description: |
        当上一轮回抽取因 LLM 超时/限流等原因降级为启发式 fallback 时，
        调用此接口清空已有图谱、预览和 warnings，重置状态为 pending 并重新入队流水线。
      parameters:
        - $ref: "#/components/parameters/PaperId"
      responses:
        "200":
          description: 已重新入队，返回当前 pending 状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperStatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: PAPER_ALREADY_PROCESSING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: PDF_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /papers/{paper_id}/qa/stream:
    post:
      tags: [papers]
      operationId: streamPaperQa
      parameters:
        - $ref: "#/components/parameters/PaperId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QaStreamRequest"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: GRAPH_NOT_READY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /patrol:
    post:
      tags: [patrol]
      operationId: runPatrol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatrolRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatrolResponse"

components:
  parameters:
    PaperId:
      name: paper_id
      in: path
      required: true
      schema:
        type: string
        example: hss-001

  responses:
    NotFound:
      description: PAPER_NOT_FOUND
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Paradigm:
      type: string
      enum: [STEM, HSS]

    PaperStatus:
      type: string
      enum: [pending, processing, ready, ready_with_warnings, failed]
      description: |
        `ready_with_warnings` means the graph is available but failed the
        confidence gate (e.g. low SUPPORTS rationale coverage, too many
        isolated nodes, or a high ratio of generic fallback edges such as
        RELATES_TO). The client should render a yellow warning border.

    PipelineStage:
      type: string
      enum: [ingesting, head_refining, classifying, extracting, storing, ready, failed]

    FailedDuringStage:
      type: string
      description: Pipeline step active when status=failed (excludes terminal stage values).
      enum: [ingesting, head_refining, classifying, extracting, storing]

    IngestHead:
      type: object
      properties:
        title:
          type: string
        abstract:
          type: string
        keywords:
          type: string
        intro:
          type: string
        sources:
          type: object
          additionalProperties:
            type: string
          description: Per-field provenance tag (pymupdf, mineru, grobid, llm, empty).

    ParadigmClassification:
      type: object
      required: [paradigm, confidence, reason]
      properties:
        paradigm:
          $ref: "#/components/schemas/Paradigm"
        confidence:
          type: number
          minimum: 0
          maximum: 1
        reason:
          type: string
      example:
        paradigm: HSS
        confidence: 0.95
        reason: 本文使用了历史制度主义视角，无显式数据集与量化指标，属于典型的人文社科规范。

    Meta:
      type: object
      properties:
        request_id:
          type: string
          format: uuid

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"

    HealthResponse:
      type: object
      properties:
        data:
          type: object
          required: [status, version, llm_mode, llm_connected, llm_note]
          properties:
            status:
              type: string
              example: ok
            version:
              type: string
              example: 1.0.0
            llm_mode:
              type: string
              enum: [mock, live]
              example: mock
            llm_connected:
              type: boolean
              example: false
            llm_note:
              type: string
              example: Mock 模式：LLM 云服务尚未接入，问答/巡检返回本地模板。
        meta:
          $ref: "#/components/schemas/Meta"

    PaperSummary:
      type: object
      required: [paper_id, status, created_at]
      properties:
        paper_id:
          type: string
        title:
          type: string
          nullable: true
        paradigm:
          $ref: "#/components/schemas/Paradigm"
          nullable: true
        status:
          $ref: "#/components/schemas/PaperStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true

    PaperListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/PaperSummary"
            total:
              type: integer
            offset:
              type: integer
            limit:
              type: integer
        meta:
          $ref: "#/components/schemas/Meta"

    PaperCreateResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            paper_id:
              type: string
            status:
              $ref: "#/components/schemas/PaperStatus"
            message:
              type: string
        meta:
          $ref: "#/components/schemas/Meta"

    PaperDetail:
      allOf:
        - $ref: "#/components/schemas/PaperSummary"
        - type: object
          properties:
            classification:
              $ref: "#/components/schemas/ParadigmClassification"
              nullable: true
            ingest_head:
              allOf:
                - $ref: "#/components/schemas/IngestHead"
              nullable: true
              description: Async dual(rules) merged document head with per-field sources.
            preview_available:
              type: boolean
              default: false
              description: True when an MVP skeleton graph is available for preview QA/graph.
            extract_warnings:
              type: array
              items:
                type: string
              description: |
                Machine-readable graph-extract degrade codes. Always includes the coarse
                `extract_heuristic_fallback` when heuristic fallback is triggered. Fine-grained
                root-cause codes may precede it: `extract_llm_timeout`,
                `extract_llm_rate_limited`, `extract_llm_json_invalid`,
                `extract_schema_validation_failed`, `extract_context_window_exceeded`.
              example: [extract_llm_timeout, extract_heuristic_fallback]
            classify_warnings:
              type: array
              items:
                type: string
              description: Machine-readable paradigm-classifier degrade codes (e.g. classifier_heuristic_fallback).
              example: []

    PaperDetailResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/PaperDetail"
        meta:
          $ref: "#/components/schemas/Meta"

    PaperStatusData:
      type: object
      required: [paper_id, status, percent, message, updated_at]
      properties:
        paper_id:
          type: string
        status:
          $ref: "#/components/schemas/PaperStatus"
        percent:
          type: integer
          minimum: 0
          maximum: 100
        stage:
          allOf:
            - $ref: "#/components/schemas/PipelineStage"
          nullable: true
        message:
          type: string
        updated_at:
          type: string
          format: date-time
        preview_available:
          type: boolean
          default: false
          description: True when an MVP skeleton graph can be queried for preview QA/graph.
        error_code:
          type: string
          nullable: true
          description: Machine-readable code when status=failed.
          example: LLM_JSON_INVALID
        failed_during:
          allOf:
            - $ref: "#/components/schemas/FailedDuringStage"
          nullable: true
          description: Pipeline step that was running when failure occurred (ingesting–storing only).
        head_refine_warnings:
          type: array
          items:
            type: string
          description: Machine-readable async head-refine degrade codes (e.g. mineru_unavailable, head_refine_timeout).
          example: []
        extract_warnings:
          type: array
          items:
            type: string
          description: |
            Machine-readable graph-extract degrade codes. Always includes the coarse
            `extract_heuristic_fallback` when heuristic fallback is triggered. Fine-grained
            root-cause codes may precede it: `extract_llm_timeout`,
            `extract_llm_rate_limited`, `extract_llm_json_invalid`,
            `extract_schema_validation_failed`, `extract_context_window_exceeded`.
          example: [extract_llm_timeout, extract_heuristic_fallback]
        classify_warnings:
          type: array
          items:
            type: string
          description: Machine-readable paradigm-classifier degrade codes (e.g. classifier_heuristic_fallback).
          example: []

    PaperStatusResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/PaperStatusData"
        meta:
          $ref: "#/components/schemas/Meta"

    GraphNode:
      type: object
      required: [id, label, type]
      properties:
        id:
          type: string
        label:
          type: string
        type:
          type: string
        data:
          type: object
          additionalProperties: true

    GraphEdge:
      type: object
      required: [id, source, target, label, type]
      properties:
        id:
          type: string
        source:
          type: string
        target:
          type: string
        label:
          type: string
        type:
          type: string
        rationale:
          type: string
          nullable: true
          description: Logical justification for the relationship.
        source_span:
          type: string
          nullable: true
          description: Verbatim textual evidence from the paper.
        confidence:
          type: string
          nullable: true
          enum: [HIGH, MEDIUM, LOW]
          description: Confidence tier for the relation.

    GraphResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            paper_id:
              type: string
            paradigm:
              $ref: "#/components/schemas/Paradigm"
            nodes:
              type: array
              items:
                $ref: "#/components/schemas/GraphNode"
            edges:
              type: array
              items:
                $ref: "#/components/schemas/GraphEdge"
        meta:
          $ref: "#/components/schemas/Meta"

    QaStreamRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 1

    PatrolMode:
      type: string
      enum: [lens_clash, contradiction]

    PatrolRequest:
      type: object
      required: [paper_ids, mode]
      properties:
        paper_ids:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: string
        mode:
          $ref: "#/components/schemas/PatrolMode"

    NodeRef:
      type: object
      required: [paper_id, node_id]
      properties:
        paper_id:
          type: string
        node_id:
          type: string
        label:
          type: string

    PatrolInsightStatus:
      type: string
      enum: [ready, insufficient_data]
      description: |
        Insight readiness status.
        `ready` means the insight was produced from a full LLM analysis.
        `insufficient_data` means the graphs lacked required node types (Thesis/SubArgument)
        and a deterministic template response was returned instead.

    PatrolInsight:
      type: object
      required: [insight_id, title, summary, status, paper_ids, node_refs]
      properties:
        insight_id:
          type: string
        title:
          type: string
        summary:
          type: string
        status:
          $ref: "#/components/schemas/PatrolInsightStatus"
        has_contradiction:
          type: boolean
          nullable: true
          description: Whether a contradiction was detected. Only meaningful when status='ready'.
        paper_ids:
          type: array
          items:
            type: string
        node_refs:
          type: array
          items:
            $ref: "#/components/schemas/NodeRef"

    PatrolResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            mode:
              $ref: "#/components/schemas/PatrolMode"
            paper_ids:
              type: array
              items:
                type: string
            insights:
              type: array
              items:
                $ref: "#/components/schemas/PatrolInsight"
            generated_at:
              type: string
              format: date-time
        meta:
          $ref: "#/components/schemas/Meta"
