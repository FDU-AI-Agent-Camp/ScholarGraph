# ScholarGraph API V1.0 纲要（BE-L 维护，实现后以 /docs 为准）
openapi: 3.1.0
info:
  title: ScholarGraph API
  version: 1.0.0
  description: V1 契约纲要，详见 docs/v1/collaboration.md

servers:
  - url: http://localhost:8000/api/v1

paths:
  /health:
    get:
      summary: 健康检查
      responses:
        "200":
          description: OK

  /papers:
    get:
      summary: 文献列表
    post:
      summary: 上传 PDF 并创建解构建图任务

  /papers/{paper_id}:
    get:
      summary: 论文元数据与分类结果

  /papers/{paper_id}/status:
    get:
      summary: 建图进度（长轮询）

  /papers/{paper_id}/graph:
    get:
      summary: G6 图谱 nodes/edges

  /papers/{paper_id}/qa/stream:
    get:
      summary: SSE 多尺度问答

  /patrol:
    post:
      summary: 双文共同体巡检
