[project]
name = "scholargraph"
version = "0.3.0.1"
description = "ScholarGraph — 学术论文逻辑解构与共同体发现 Agent（后端）"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "FDU-AI-Agent-Camp" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "pymupdf>=1.24.0",
    "json-repair>=0.35.0",
    "tenacity>=9.0.0",
    "numpy>=1.26.0",
    "chromadb>=0.5.0",
    "sqlalchemy>=2.0.51",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
]

[project.optional-dependencies]
mysql = [
    "pymysql>=1.1.0",
    "cryptography>=43.0.0",
]
mineru = [
    "mineru[pipeline]>=3.2.3",
    "six>=1.16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "pytest-cov>=6.0.0",
    "pip-audit>=2.7.0",
    "pyright>=1.1.410",
]
e2e = [
    "playwright>=1.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "red: 红灯用例，依赖尚未交付的 BE 模块；默认排除，使用 pytest -m red",
    "live_e10: E-10 真云超时抽验，需有效 SCHOLARGRAPH_API_KEY；默认排除",
    "live_head_merge: head merge 真云 LLM 抽验，需 SCHOLARGRAPH_API_KEY；默认排除",
    "live_mineru: MinerU path-B 真机对比实验，需 uv sync --extra mineru 与语料 PDF；默认排除",
    "live_grobid: GROBID sidecar isalive 抽验，需 docker compose up；默认排除",
    "live_benchmark: 全量 17 篇 benchmark 与 committed baseline 对比；需语料 + MinerU + GROBID；默认排除",
    "live_judge: QA Judge snapshot 回放小样本 CI；需 JUDGE_SNAPSHOT_REPLAY=1，零 token",
    "live: Patrol V2 live embedding / reranker 金标回归；需 LLM_MODE=live 与 API 凭证；默认排除",
    "integration: 跨节点 / 编译后工作流集成测试",
    "three_branch: FE + platform + ingest 三分支联调（语料缺失时 skip）",
    "smoke: 快速冒烟（import / 路由 / 契约字段）",
]
addopts = "-m 'not red and not live and not live_mineru and not live_grobid and not live_benchmark and not live_e10 and not live_judge'"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["backend", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
